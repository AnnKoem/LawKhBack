services:
  - type: web
    name: lawkh-back
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python start_backend.py
    envVars:
      - key: PORT
        value: 8000
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: lawkh
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RUN_TELEGRAM_BOT
        value: false
      - key: CHROMA_SOURCE_DIR
        value: rag/chroma_db
      - key: CHROMA_COLLECTION_NAME
        value: cambodian_laws
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-large
      - key: RAG_OFFLINE_MODE
        value: false
